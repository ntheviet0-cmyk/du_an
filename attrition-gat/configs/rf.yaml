# RF search space (Optuna) — full run 50 trials, smoke 3 trials
n_trials_full: 50
search:
  n_estimators: [200, 1000]
  max_depth: [3, 20]  # + None voi p=0.2
  min_samples_leaf: [1, 10]
  max_features: ["sqrt", "log2", "0.3-0.8"]
  class_weight: ["balanced", "balanced_subsample"]
cv_inner:
  val_size: 0.2
