# XGBoost search space (Optuna) — full run 50 trials, smoke 3 trials
n_trials_full: 50
search:
  n_estimators: [100, 1000]
  max_depth: [2, 8]
  learning_rate: [0.01, 0.3]  # log
  subsample: [0.5, 1.0]
  colsample_bytree: [0.5, 1.0]
  min_child_weight: [1, 10]
  reg_lambda: [0.001, 10.0]  # log
  reg_alpha: [0.001, 10.0]  # log
  scale_pos_weight: [1.0, 8.0]
fixed:
  eval_metric: "logloss"
  tree_method: "hist"
  random_state: 42
  n_jobs: -1
